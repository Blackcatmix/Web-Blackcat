<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlackCat — Bebidas &amp; Cocktails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #0a0a0a; color: #fff; font-family: 'Barlow', sans-serif; overflow-x: hidden; }

    /* NAVEGACIÓN */
    nav { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0.8rem 2rem; 
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.15); 
      position: sticky; 
      top: 0; 
      background: rgba(10, 10, 10, 0.95); 
      backdrop-filter: blur(10px);
      z-index: 100; 
    }
    .nav-logo img { height: 95px; width: auto; display: block; object-fit: contain; }
    .nav-links { display: flex; gap: 1.8rem; margin-left: auto; }
    .nav-links a { color: #d0d0d0; text-decoration: none; font-size: 13px; letter-spacing: 1.5px; cursor: pointer; transition: color 0.2s; text-transform: uppercase; font-weight: 500; }
    .nav-links a:hover { color: #C9A84C; }

    /* HERO */
    .hero { 
      text-align: center; 
      padding: 6.5rem 2rem 5rem; 
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); 
      background-image: linear-gradient(to bottom, rgba(10,10,10,0.85) 0%, rgba(10,10,10,0.7) 50%, #0a0a0a 100%), url('https://i.imgur.com/KZRuJpM.jpeg'); 
      background-size: cover; 
      background-position: center center; 
    }
    .hero-eyebrow { font-size: 12px; letter-spacing: 4px; color: #C9A84C; margin-bottom: 1.2rem; text-transform: uppercase; font-weight: 600; }
    .hero h1 { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(38px, 6.5vw, 62px); font-weight: 700; letter-spacing: 3px; line-height: 1.08; margin-bottom: 1.3rem; text-transform: uppercase; }
    .hero h1 span { color: #C9A84C; }
    .hero-sub { font-size: 16px; color: #e5e5e5; max-width: 540px; margin: 0 auto 2.5rem; line-height: 1.8; }
    
    .hero-actions { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .hero-row-btn { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .btn-o { background: rgba(0,0,0,0.4); color: #C9A84C; padding: 13px 28px; border: 1px solid #C9A84C; font-size: 12px; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; font-weight: 600; transition: all 0.25s ease; border-radius: 2px; }
    .btn-o:hover { background: #C9A84C; color: #0a0a0a; transform: translateY(-2px); }
    .btn-p { background: #C9A84C; color: #0a0a0a; padding: 14px 42px; border: 1px solid #C9A84C; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; cursor: pointer; text-transform: uppercase; transition: all 0.25s ease; border-radius: 2px; }
    .btn-p:hover { background: #e0c06a; border-color: #e0c06a; transform: translateY(-2px); }

    /* CARROUSEL */
    .carousel-section { max-width: 980px; margin: 3.5rem auto 0; padding: 0 1.5rem; }
    .carousel-container { position: relative; width: 100%; border: 0.5px solid rgba(201, 168, 76, 0.3); border-radius: 4px; overflow: hidden; background: #111; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .carousel-track { display: flex; transition: transform 0.5s ease-in-out; width: 100%; }
    .carousel-slide { min-width: 100%; width: 100%; position: relative; height: 440px; flex-shrink: 0; background: #0a0a0a; }
    .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .carousel-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 1.8rem 2rem 2.8rem; background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 60%, transparent 100%); font-size: 14px; letter-spacing: 1.5px; color: #f0f0f0; text-transform: uppercase; font-weight: 600; text-align: center; }
    .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(10, 10, 10, 0.8); color: #C9A84C; border: 1px solid rgba(201, 168, 76, 0.5); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; transition: all 0.2s; z-index: 10; user-select: none; }
    .carousel-btn:hover { background: #C9A84C; color: #000; }
    .carousel-btn.prev { left: 15px; }
    .carousel-btn.next { right: 15px; }
    .carousel-dots { display: flex; justify-content: center; gap: 8px; position: absolute; bottom: 12px; left: 0; right: 0; z-index: 11; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); cursor: pointer; transition: all 0.25s; }
    .dot.active { background: #C9A84C; width: 24px; border-radius: 5px; }

    /* SECCIONES Y COMPENSACIÓN DE CABECERA (scroll-margin-top) */
    .sec { 
      padding: 4.5rem 2rem; 
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.12); 
      max-width: 1100px; 
      margin: 0 auto; 
      scroll-margin-top: 125px; /* Evita que el menú sticky corte el título */
    }
    .sec-label { font-size: 11px; letter-spacing: 4px; color: #C9A84C; margin-bottom: 0.7rem; text-transform: uppercase; font-weight: 600; }
    .sec h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 700; letter-spacing: 2px; margin-bottom: 2rem; text-transform: uppercase; }
    
    .about { font-size: 16px; color: #d5d5d5; line-height: 1.9; }
    .about strong { color: #fff; font-weight: 600; }
    
    .feats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.2rem; margin-top: 2.5rem; }
    .feat { border: 0.5px solid rgba(255, 255, 255, 0.18); padding: 1.6rem; background: rgba(255,255,255,0.02); transition: all 0.25s; }
    .feat:hover { border-color: rgba(201, 168, 76, 0.6); transform: translateY(-3px); }
    .feat-n { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; color: #C9A84C; letter-spacing: 2px; margin-bottom: 0.6rem; font-weight: 700; }
    .feat h3 { font-size: 13px; font-weight: 700; letter-spacing: 1px; margin-bottom: 0.5rem; text-transform: uppercase; color: #fff; }
    .feat p { font-size: 13px; color: #bbb; line-height: 1.6; }

    /* BARRAS (SIN SCROLL, MISMO LARGO TOTAL QUE CULTO) */
    .barras-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 1.2rem; 
      align-items: stretch; 
      width: 100%;
    }
    details.bcard { 
      border: 0.5px solid rgba(255, 255, 255, 0.15); 
      background: #111; 
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.25s;
    }
    details.bcard[open] { border-color: rgba(201, 168, 76, 0.7); }
    details.bcard:hover { border-color: rgba(201, 168, 76, 0.6); }
    
    summary.bhead { 
      padding: 1.5rem 1rem; 
      text-align: center; 
      background: #141414; 
      cursor: pointer; 
      list-style: none;
      user-select: none;
      outline: none;
    }
    summary.bhead::-webkit-details-marker { display: none; }
    summary.bhead:hover { background: #191919; }
    
    .bcard h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 23px; font-weight: 700; letter-spacing: 3px; margin-bottom: 0.4rem; color: #fff; }
    .bcard .desc { font-size: 13px; color: #C9A84C; line-height: 1.4; font-weight: 500; min-height: 38px; }
    
    .btrigger { 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      margin-top: 1rem; 
      font-size: 11px; 
      letter-spacing: 1.5px; 
      text-transform: uppercase; 
      color: #aaa; 
      border: 1px solid rgba(255,255,255,0.18); 
      padding: 6px 14px; 
      border-radius: 20px; 
      transition: all 0.25s; 
    }
    summary.bhead:hover .btrigger { color: #C9A84C; border-color: #C9A84C; }
    .bchevron { width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); transition: transform 0.3s; margin-bottom: 2px; }
    
    details.bcard[open] .bchevron { transform: rotate(-135deg); margin-bottom: -2px; }
    details.bcard[open] .btrigger { color: #C9A84C; border-color: #C9A84C; background: rgba(201,168,76,0.08); }
    
    .bbody { 
      background: #0d0d0d; 
      font-size: 13.5px; 
      color: #dedede; 
      line-height: 1.65; 
      padding: 1.5rem 1.2rem;
      border-top: 0.5px solid rgba(255,255,255,0.08); 
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .bbody ul { padding-left: 1.1rem; margin-bottom: 1.8rem; }
    .bbody ul li { margin-bottom: 7px; list-style-type: disc; }
    .bfooter-notes { margin-top: auto; padding-top: 1.2rem; border-top: 0.5px dashed rgba(255,255,255,0.12); }
    .bfooter-notes em { color: #C9A84C; font-size: 12.5px; line-height: 1.5; display: block; font-style: normal; }

    /* UPGRADES (ALTURA EXACTA 250px) */
    .upgrades-list { display: flex; flex-direction: column; gap: 1.4rem; }
    .upgrade-card { 
      display: grid; 
      grid-template-columns: 1fr 320px; 
      height: 250px; 
      max-height: 250px;
      border: 0.5px solid rgba(255, 255, 255, 0.15); 
      background: #111; 
      overflow: hidden; 
      border-radius: 3px;
      transition: border-color 0.25s, transform 0.25s; 
    }
    .upgrade-card:hover { border-color: rgba(201, 168, 76, 0.6); transform: translateY(-2px); }
    .upgrade-content { padding: 1.8rem 2.2rem; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
    .upgrade-top { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.6rem; }
    .upgrade-num { font-size: 13px; color: #C9A84C; font-weight: 700; letter-spacing: 2px; }
    .upgrade-title { font-family: 'Barlow Condensed', sans-serif; font-size: 25px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; }
    .upgrade-text { font-size: 14.5px; color: #cfcfcf; line-height: 1.6; margin-bottom: 1rem; }
    .upgrade-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .upgrade-tag { font-size: 11px; color: #C9A84C; border: 0.5px solid rgba(201, 168, 76, 0.4); padding: 4px 12px; text-transform: uppercase; letter-spacing: 1px; background: rgba(201, 168, 76, 0.05); }
    
    .upgrade-img { width: 100%; height: 250px; max-height: 250px; background: #161616; overflow: hidden; }
    .upgrade-img img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; filter: brightness(0.9); transition: filter 0.3s; }
    .upgrade-card:hover .upgrade-img img { filter: brightness(1); }

    /* CONTACTO */
    .cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; margin-top: 1.8rem; }
    .contact-link { text-decoration: none; display: block; color: inherit; transition: transform 0.2s; }
    .contact-link:hover { transform: translateY(-4px); }
    .citem { border: 0.5px solid rgba(255, 255, 255, 0.15); padding: 1.5rem; background: #111; height: 100%; transition: border-color 0.2s; }
    .citem:hover { border-color: rgba(201, 168, 76, 0.6); }
    .citem .cl { font-size: 11px; color: #C9A84C; letter-spacing: 2px; margin-bottom: 0.5rem; text-transform: uppercase; font-weight: 600; }
    .citem .cv { font-size: 15px; color: #eee; font-weight: 500; word-break: break-all; }

    footer { text-align: center; padding: 2.5rem 1rem; font-size: 12px; color: #777; letter-spacing: 1.5px; text-transform
